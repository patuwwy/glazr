name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Glazr (${{ matrix.platform }})
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - platform: x64
            out_dir: x64/Release
            asset_name: Glazr-x64.exe
            zip_name: Glazr-x64-${{ github.ref_name }}.zip
          - platform: x86
            out_dir: Release
            asset_name: Glazr-x86.exe
            zip_name: Glazr-x86-${{ github.ref_name }}.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release (${{ matrix.platform }})
        run: |
          msbuild Glazr.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m

      - name: Prepare release files
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.out_dir }}/Glazr.exe" -Destination "${{ matrix.asset_name }}"
          Compress-Archive -Path "${{ matrix.asset_name }}", "README.md" -DestinationPath "${{ matrix.zip_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.zip_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: Glazr ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*-build/Glazr-*.exe
            artifacts/*-build/Glazr-*.zip

